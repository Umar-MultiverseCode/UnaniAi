{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Unani AI</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="logo">
            <span class="neon-text">Unani</span>AI
        </div>
        <div class="nav-links">
            <a href="{% url 'index' %}">Home</a>
            <a href="#">About</a>
            <a href="#">Consult</a>
            <a href="#">Remedies</a>
            <a href="#">Contact</a>
            <a href="{% url 'signup' %}" class="signup-btn glass">Sign Up</a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="hero">
        <div class="particle-container">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="hero-content">
            <!-- Login Form -->
            <div class="signup-container glass">
                <h2>Log In</h2>
                <form class="signup-form" method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" class="glass" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" class="glass" required>
                    </div>
                    <button type="submit" class="cta-button pulse">
                        Log In
                        <div class="button-glow"></div>
                    </button>
                </form>
                <p>
                    Don't have an account? <a href="{% url 'signup' %}" id="signup-link">Sign Up</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Script for Signup Link -->
    <script>
        document.getElementById('signup-link').addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = "{% url 'signup' %}";
        });
    </script>
    <!-- signup.html aur login.html -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
